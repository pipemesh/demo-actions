# demo-actions — a dogfooding repo for DESIGN-V42 (2026-09-05): jobs whose
# executor is a GitHub Actions workflow (github_actions:). The mainline is
# release-flow shaped: `build` is a build that runs the build.yml Actions
# workflow and whose `dist` artifact Pipemesh imports; `verify` runs on
# Pipemesh's hosted compute and reads that artifact (consumes:); the two
# deploys are runs of deploy.yml. An Actions job's checkout is read from
# its workflow file, so none of them says checkout:. Every workflow checks
# out the revision Pipemesh hands it (pipemesh_sha) and names its run
# after pipemesh_run so the runner can match it exactly.
#
# demo-* repos exercise engine features end-to-end on the production
# instance without touching the pipemesh/pipemesh mainline.

deployment:
  type: pipeline
  stages:
    - build
    - staging
    - production

  jobs:
    build:
      job_type: build
      stage: build
      timeout_seconds: 900
      produces:
        dist: file
      github_actions: build.yml

    # Hosted compute reading what Actions built: the dist entry — the
    # Actions artifact of that name — unpacks at dist/. It checks out
    # nothing: the artifact is its only input, so a dist it already
    # verified reuses that run.
    verify:
      job_type: build
      stage: build
      consumes:
        - build/dist
      checkout: false
      script: |
        echo "built version $(cat dist/version.txt) at $(cat dist/revision.txt)"
        test "$(cat dist/revision.txt)" = "$CI_COMMIT_SHA"
        test -x dist/deploy.sh || chmod +x dist/deploy.sh
        echo "artifact from GitHub Actions verified"

    deploy_staging:
      job_type: deploy
      production: false
      stage: staging
      needs:
        - verify
      timeout_seconds: 900
      github_actions:
        workflow: deploy.yml
        inputs:
          environment: staging

    deploy_prod:
      job_type: deploy
      production: true
      stage: production
      needs:
        - deploy_staging
      timeout_seconds: 900
      github_actions:
        workflow: deploy.yml
        inputs:
          environment: production

pipemesh:
  pipelines:
    deployment: !ref deployment
