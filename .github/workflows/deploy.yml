# Dispatched by Pipemesh (DESIGN-V42). Pipemesh always sends pipemesh_sha
# (the revision to deploy) and pipemesh_run (its job run id); the definition
# adds `environment`. The run name carries pipemesh_run so Pipemesh can
# match this run to its job without guessing.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      pipemesh_sha:
        description: Revision to deploy (set by Pipemesh)
        type: string
        required: true
      pipemesh_run:
        description: Pipemesh job run id (set by Pipemesh)
        type: string
        required: true
      environment:
        description: Target environment
        type: string
        required: true

run-name: deploy ${{ inputs.environment }} · ${{ inputs.pipemesh_run }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pipemesh_sha }}
      - name: Show what is being deployed
        run: |
          echo "environment: ${{ inputs.environment }}"
          echo "revision:    ${{ inputs.pipemesh_sha }}"
          echo "version:     $(cat app/VERSION)"
      - name: Deploy
        run: sh app/deploy.sh "${{ inputs.environment }}"
      # What this run deployed, as one Markdown file: Pipemesh shows it in
      # the deploy job's Reports tab (reports: deploy-summary).
      - name: Summarize
        if: always()
        run: |
          {
            echo "# ${{ job.status == 'success' && '✅' || '❌' }} ${{ inputs.environment }}: demo-actions $(cat app/VERSION)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Version | $(cat app/VERSION) |"
            echo "| Revision | \`${{ inputs.pipemesh_sha }}\` |"
            echo "| Outcome | ${{ job.status }} |"
            echo "| Actions run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } > deploy-summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-summary
          path: deploy-summary.md
