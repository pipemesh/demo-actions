# Dispatched by Pipemesh (DESIGN-V42): the build runs on GitHub Actions
# and hands its output back as a named artifact, which Pipemesh imports
# so downstream jobs inherit it through needs:, and its test results as
# another, which Pipemesh shows as the job's report.
name: Build

on:
  workflow_dispatch:
    inputs:
      pipemesh_sha:
        description: Revision to build (set by Pipemesh)
        type: string
        required: true
      pipemesh_run:
        description: Pipemesh job run id (set by Pipemesh)
        type: string
        required: true

run-name: build · ${{ inputs.pipemesh_run }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pipemesh_sha }}
      # The tests write their results as a small site; it is uploaded
      # whether they pass or not, and Pipemesh shows it in the build job's
      # Reports tab (reports: test-report in pipemesh.yaml).
      - name: Test
        run: sh app/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report
      - name: Build
        run: |
          sh app/build.sh
          mkdir -p dist
          printf '%s\n' "$(cat app/VERSION)" > dist/version.txt
          printf '%s\n' "${{ inputs.pipemesh_sha }}" > dist/revision.txt
          cp app/deploy.sh dist/deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
